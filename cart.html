<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:Poppins,sans-serif;background:#f8f8f8;padding:40px;}
h2{text-align:center;margin-bottom:30px;}

.item{
background:white;
padding:15px;
margin-bottom:15px;
border-radius:10px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

button{
background:red;
color:white;
border:none;
padding:5px 10px;
border-radius:10px;
cursor:pointer;
}

.total{
text-align:center;
font-size:20px;
margin-top:20px;
font-weight:600;
}

.order{
display:block;
text-align:center;
margin-top:20px;
padding:12px;
background:#25D366;
color:white;
text-decoration:none;
border-radius:25px;
}
</style>
</head>

<body>

<h2>Your Cart</h2>
<div id="cart-items"></div>
<div class="total" id="total"></div>
<a id="orderBtn" class="order">Order via WhatsApp</a>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let cartContainer = document.getElementById("cart-items");
let total = 0;

function displayCart(){
cartContainer.innerHTML="";
total=0;

cart.forEach((item,index)=>{
total += item.price;

cartContainer.innerHTML += `
<div class="item">
${item.name} - Rs ${item.price}
<button onclick="removeItem(${index})">X</button>
</div>
`;
});

document.getElementById("total").innerText = "Total: Rs " + total;

let message = "Order Details:%0A";
cart.forEach(item=>{
message += item.name + " - Rs " + item.price + "%0A";
});
message += "Total: Rs " + total;

document.getElementById("orderBtn").href =
"https://wa.me/923000000000?text=" + message;
}

function removeItem(index){
cart.splice(index,1);
localStorage.setItem("cart",JSON.stringify(cart));
displayCart();
}

displayCart();
</script>

</body>
</html>
