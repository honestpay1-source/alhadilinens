<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al Hadi Linens</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Poppins,sans-serif;background:#f8f8f8;}

header{
background:linear-gradient(135deg,#ff4e8b,#ffb347);
padding:20px 50px;
display:flex;
justify-content:space-between;
align-items:center;
color:white;
}

header a{
color:white;
text-decoration:none;
font-weight:600;
}

.products{
padding:60px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
text-align:center;
}

.card img{
width:100%;
border-radius:10px;
}

.price{
margin:10px 0;
font-weight:600;
}

button{
padding:10px 20px;
border:none;
border-radius:20px;
background:#ff4e8b;
color:white;
cursor:pointer;
font-weight:600;
}
</style>
</head>

<body>

<header>
<h2>AL HADI LINENS</h2>
<a href="cart.html">View Cart 🛒</a>
</header>

<section class="products">

<div class="card">
<img src="https://via.placeholder.com/300">
<h3>Punjabi Suit</h3>
<div class="price">8500</div>
<button onclick="addToCart('Punjabi Suit',8500)">Add to Cart</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/300">
<h3>Sindhi Ajrak</h3>
<div class="price">9200</div>
<button onclick="addToCart('Sindhi Ajrak',9200)">Add to Cart</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/300">
<h3>KPK Wear</h3>
<div class="price">8800</div>
<button onclick="addToCart('KPK Wear',8800)">Add to Cart</button>
</div>

</section>

<script>
function addToCart(name,price){
let cart = JSON.parse(localStorage.getItem("cart")) || [];
cart.push({name:name,price:price});
localStorage.setItem("cart",JSON.stringify(cart));
alert("Added to cart!");
}
</script>

</body>
</html>
