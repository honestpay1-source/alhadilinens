<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al Hadi Linens</title>

<!-- Google Font (Same Modern Feel) -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
}

/* HERO SECTION */
.hero{
  height:100vh;
  background: linear-gradient(135deg,#ff4e8b,#ff7e5f,#ffb347);
  color:white;
  padding:40px 80px;
  position:relative;
}

/* TOP NAV */
.navbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:28px;
  font-weight:700;
}

.nav-buttons a{
  text-decoration:none;
  margin-left:15px;
  padding:10px 20px;
  border-radius:20px;
  font-size:14px;
}

.login{
  border:1px solid white;
  color:white;
}

.signup{
  background:white;
  color:#ff4e8b;
  font-weight:600;
}

/* MAIN CONTENT */
.content{
  display:flex;
  justify-content:space-between;
  align-items:center;
  height:80%;
}

.left h1{
  font-size:90px;
  font-weight:800;
  line-height:1;
}

.left p{
  margin-top:20px;
  font-size:18px;
}

.right{
  max-width:350px;
}

.right h3{
  font-size:22px;
  margin-bottom:20px;
}

.app-buttons a{
  display:inline-block;
  margin-right:10px;
  padding:10px 15px;
  border:1px solid white;
  border-radius:10px;
  text-decoration:none;
  color:white;
  font-size:14px;
  margin-top:10px;
}

/* RESPONSIVE */
@media(max-width:900px){
  .content{
    flex-direction:column;
    text-align:center;
  }

  .left h1{
    font-size:50px;
  }

  .right{
    margin-top:30px;
  }
}
</style>
</head>

<body>

<section class="hero">

  <div class="navbar">
    <div class="logo">AL HADI LINENS</div>
    <div class="nav-buttons">
      <a href="#" class="login">Log in</a>
      <a href="#" class="signup">Sign up</a>
    </div>
  </div>

  <div class="content">
    <div class="left">
      <h1>One brand<br>for all styles</h1>
      <p>Premium Pakistani Cultural Fashion</p>
    </div>

    <div class="right">
      <h3>Single destination for all your traditional wear.</h3>
      <div class="app-buttons">
        <a href="#">Shop Now</a>
        <a href="#">View Collection</a>
      </div>
    </div>
  </div>

</section>

</body>
</html>
