<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Web Theme</title>
    <style>
        :root {
            /* Default Colors */
            --bg-color: #ffffff;
            --text-color: #000000;
            --accent-color: #007bff;
            --card-bg: #f4f4f4;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Playfair Display', serif; /* Luxury font feel */
            transition: all 0.5s ease;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            padding: 40px;
            background-color: var(--card-bg);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 { color: var(--accent-color); font-size: 3rem; }

        button {
            background-color: var(--accent-color);
            color: var(--bg-color);
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        button:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Luxury Experience</h1>
        <p>Premium aesthetics for high-end websites.</p>
        <br>
        <button onclick="applyLuxuryTheme()">Apply Luxury Colors</button>
    </div>

    <script>
        function applyLuxuryTheme() {
            // Setting Luxury Palette
            const root = document.documentElement;
            
            root.style.setProperty('--bg-color', '#0D0D0D');    // Rich Black
            root.style.setProperty('--text-color', '#F2E8CF');  // Champagne
            root.style.setProperty('--accent-color', '#C5A059'); // Soft Gold
            root.style.setProperty('--card-bg', '#1A1A1A');     // Deep Charcoal
            
            console.log("Luxury Theme Applied!");
        }
    </script>

</body>
</html>
