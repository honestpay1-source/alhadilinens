<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
    /* WhatsApp Floating Button Styling */
    .whatsapp-float {
        position: fixed;
        bottom: 30px;
        right: 30px;
        background-color: #C5A059; /* Luxury Gold Color */
        color: #0D0D0D;            /* Dark Black Icon */
        width: 60px;
        height: 60px;
        border-radius: 50px;
        text-align: center;
        font-size: 30px;
        box-shadow: 0px 4px 15px rgba(197, 160, 89, 0.5);
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        transition: all 0.3s ease;
    }

    /* Hover Effect */
    .whatsapp-float:hover {
        background-color: #0D0D0D;
        color: #C5A059;
        transform: scale(1.1);
        border: 2px solid #C5A059;
    }

    /* Tooltip text (Optional) */
    .whatsapp-float::before {
        content: "Chat with us";
        position: absolute;
        right: 75px;
        background: #1A1A1A;
        color: #C5A059;
        padding: 5px 15px;
        border-radius: 5px;
        font-size: 14px;
        white-space: nowrap;
        opacity: 0;
        transition: 0.3s;
        pointer-events: none;
        border: 1px solid #C5A059;
    }

    .whatsapp-float:hover::before {
        opacity: 1;
    }
</style>

<a href="https://wa.me/923190833295?text=Hello!%20I%20am%20interested%20in%20your%20luxury%20services." 
   class="whatsapp-float" 
   target="_blank">
    <i class="fab fa-whatsapp"></i>
</a>
